name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $errors = @()
          Get-ChildItem -Recurse -File -Include *.ps1,*.psm1 | ForEach-Object {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName,
                  [ref]$tokens,
                  [ref]$parseErrors
              ) | Out-Null
              $errors += $parseErrors
          }

          if ($errors.Count -gt 0) {
              $errors | Format-List
              throw "$($errors.Count) PowerShell parse error(s) found."
          }

      - name: Run unit and integration tests
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\Tests\Run-Tests.ps1
