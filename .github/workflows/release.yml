name: Publish release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Publish the tested source tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$RELEASE_TAG" --verify-tag --title "PearlPilot $RELEASE_TAG" --generate-notes \
            --notes "Requires Windows 11 x64, an NVIDIA GPU, and Docker Desktop with WSL2. Extract the source ZIP and follow the README to run Install.ps1."
